{{- if eq (.Values.metrics.port | int) (.Values.health.port | int) -}}
{{- fail "metrics.port and health.port must differ; they bind separate manager listeners" -}}
{{- end -}}
{{- $controller := merge (deepCopy (.Values.controller | default dict)) (dict "clusterDomain" "cluster.local" "installationNamespace" "" "cloudflareRequestTimeoutSeconds" 30 "maxIngressRules" 1000 "maxConfigurationBytes" 1048576) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cfgate.fullname" . }}
  namespace: {{ include "cfgate.namespace" . }}
  labels:
    {{- include "cfgate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cfgate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cfgate.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cfgate.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ if hasKey .Values "terminationGracePeriodSeconds" }}{{ .Values.terminationGracePeriodSeconds }}{{ else }}30{{ end }}
      containers:
        - name: manager
          image: {{ include "cfgate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
            - --health-probe-bind-address=:{{ .Values.health.port }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - {{ printf "--cluster-domain=%s" $controller.clusterDomain | quote }}
            - {{ printf "--cloudflare-request-timeout=%ds" ($controller.cloudflareRequestTimeoutSeconds | int64) | quote }}
            - {{ printf "--max-ingress-rules=%d" ($controller.maxIngressRules | int64) | quote }}
            - {{ printf "--max-configuration-bytes=%d" ($controller.maxConfigurationBytes | int64) | quote }}
            {{- with $controller.installationNamespace }}
            - {{ printf "--installation-namespace=%s" . | quote }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
