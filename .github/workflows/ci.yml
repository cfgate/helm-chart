name: CI

on:
  push:
    branches: [main]
    paths:
      - "Chart.yaml"
      - "values.yaml"
      - "values.schema.json"
      - ".helmignore"
      - "templates/**"
      - "ci/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/actionlint.yaml"
      - "cliff.toml"
      - "artifacthub-repo.yml"
  pull_request:
    branches: [main]
    paths:
      - "Chart.yaml"
      - "values.yaml"
      - "values.schema.json"
      - ".helmignore"
      - "templates/**"
      - "ci/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/actionlint.yaml"
      - "cliff.toml"
      - "artifacthub-repo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: rhysd/actionlint@v1.7.12

  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      - name: Lint chart
        run: helm lint .

      - name: Template with defaults
        run: helm template cfgate .

      - name: Template with CI values
        run: helm template cfgate . -f ci/default-values.yaml

      - name: Template with external CRDs and RBAC
        run: helm template cfgate . --set installCRDs=false --set rbac.create=false

      - name: Test chart contracts and release guards
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v
