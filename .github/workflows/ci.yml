name: CI

on:
  push:
    branches: [main]
    paths:
      - "Chart.yaml"
      - "values.yaml"
      - "values.schema.json"
      - "templates/**"
      - "ci/**"
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
      - "cliff.toml"
      - "artifacthub-repo.yml"
  pull_request:
    branches: [main]
    paths:
      - "Chart.yaml"
      - "values.yaml"
      - "values.schema.json"
      - "templates/**"
      - "ci/**"
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
      - "cliff.toml"
      - "artifacthub-repo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: rhysd/actionlint@v1.7.12

  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.4

      - name: Lint chart
        run: helm lint .

      - name: Template with defaults
        run: helm template cfgate .

      - name: Template with CI values
        run: helm template cfgate . -f ci/default-values.yaml
